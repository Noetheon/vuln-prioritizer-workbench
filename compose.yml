services:
  db:
    image: postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: ${POSTGRES_DB:-workbench}
      POSTGRES_USER: ${POSTGRES_USER:-workbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before running Compose. For local-only quickstart, copy .env.example to .env.}
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata

  backend:
    image: ${DOCKER_IMAGE_BACKEND:-vuln-prioritizer-workbench-backend}:${TAG:-local}
    restart: always
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-Vuln Prioritizer Workbench}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY before running Compose. For local-only quickstart, copy .env.example to .env.}
      LOCAL_WORKBENCH_USER_EMAIL: ${LOCAL_WORKBENCH_USER_EMAIL:-local@workbench.test}
      DOMAIN: ${DOMAIN:-localhost}
      FRONTEND_HOST: ${FRONTEND_HOST:-http://localhost:5173}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost,http://localhost:5173,http://127.0.0.1:5173}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,testserver,backend}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-}
      SQLALCHEMY_DATABASE_URI: ""
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-600}
      DECISION_API_MAX_FINDINGS: ${DECISION_API_MAX_FINDINGS:-1000}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      MAX_REPORT_MB: ${MAX_REPORT_MB:-50}
      MAX_REPORTS_PER_RUN: ${MAX_REPORTS_PER_RUN:-20}
      POSTGRES_SERVER: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-workbench}
      POSTGRES_USER: ${POSTGRES_USER:-workbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before running Compose. For local-only quickstart, copy .env.example to .env.}
      IMPORT_UPLOAD_DIR: /app/workbench-import-uploads
      REPORT_DIR: /app/workbench-reports
      PROVIDER_SNAPSHOT_DIR: /app/provider-snapshots
      PROVIDER_CACHE_DIR: /app/workbench-provider-cache
      ATTACK_ARTIFACT_DIR: /app/examples/attack
      DEMO_PROVIDER_SNAPSHOT_ENABLED: ${DEMO_PROVIDER_SNAPSHOT_ENABLED:-false}
      DEMO_WORKSPACE_ENABLED: ${DEMO_WORKSPACE_ENABLED:-false}
      NVD_API_KEY: ${NVD_API_KEY:-}
      VULN_PRIORITIZER_NVD_API_KEY_ENV: ${VULN_PRIORITIZER_NVD_API_KEY_ENV:-NVD_API_KEY}
    volumes:
      - workbench-import-uploads:/app/workbench-import-uploads
      - workbench-reports:/app/workbench-reports
      - workbench-provider-snapshots:/app/provider-snapshots
      - workbench-provider-cache:/app/workbench-provider-cache
      - ./data:/app/examples:ro
    labels:
      - traefik.enable=${TRAEFIK_API_ENABLED:-false}
      - traefik.http.services.workbench-backend.loadbalancer.server.port=8000
      - traefik.http.routers.workbench-backend-http.entrypoints=http
      - traefik.http.routers.workbench-backend-http.rule=Host(`api.${DOMAIN:-localhost}`)
      - traefik.http.routers.workbench-backend-http.middlewares=https-redirect
      - traefik.http.middlewares.https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.https-redirect.redirectscheme.permanent=true
      - traefik.http.routers.workbench-backend-https.entrypoints=https
      - traefik.http.routers.workbench-backend-https.rule=Host(`api.${DOMAIN:-localhost}`)
      - traefik.http.routers.workbench-backend-https.tls=true
      - traefik.http.routers.workbench-backend-https.tls.certresolver=le
      - traefik.http.routers.workbench-backend-https.middlewares=workbench-api-ipallowlist,workbench-upload-limit
      - traefik.http.middlewares.workbench-api-ipallowlist.ipallowlist.sourcerange=${TRAEFIK_API_IP_ALLOWLIST:-127.0.0.1/32}
      - traefik.http.middlewares.workbench-upload-limit.buffering.maxRequestBodyBytes=${TRAEFIK_MAX_REQUEST_BODY_BYTES:-26214400}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, os, urllib.request; domain=os.environ.get('DOMAIN', 'localhost'); host='localhost' if domain in {'localhost', '127.0.0.1'} else f'api.{domain}'; req=urllib.request.Request('http://127.0.0.1:8000/api/v1/utils/health-check/', headers={'Host': host}); data=json.load(urllib.request.urlopen(req, timeout=2)); assert data is True",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: ${DOCKER_IMAGE_FRONTEND:-vuln-prioritizer-workbench-frontend}:${TAG:-local}
    restart: always
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    labels:
      - traefik.enable=${TRAEFIK_APP_ENABLED:-false}
      - traefik.http.services.workbench-frontend.loadbalancer.server.port=8080
      - traefik.http.routers.workbench-frontend-http.entrypoints=http
      - traefik.http.routers.workbench-frontend-http.rule=Host(`${DOMAIN:-localhost}`)
      - traefik.http.routers.workbench-frontend-http.middlewares=https-redirect
      - traefik.http.routers.workbench-frontend-https.entrypoints=https
      - traefik.http.routers.workbench-frontend-https.rule=Host(`${DOMAIN:-localhost}`)
      - traefik.http.routers.workbench-frontend-https.tls=true
      - traefik.http.routers.workbench-frontend-https.tls.certresolver=le
      - traefik.http.routers.workbench-frontend-https.middlewares=workbench-app-ipallowlist
      - traefik.http.middlewares.workbench-app-ipallowlist.ipallowlist.sourcerange=${TRAEFIK_APP_IP_ALLOWLIST:-127.0.0.1/32}

volumes:
  app-db-data:
    name: ${WORKBENCH_DB_VOLUME:-workbench-db-data}
  workbench-import-uploads:
    name: ${WORKBENCH_IMPORT_UPLOADS_VOLUME:-workbench-import-uploads}
  workbench-reports:
    name: ${WORKBENCH_REPORTS_VOLUME:-workbench-reports}
  workbench-provider-snapshots:
    name: ${WORKBENCH_PROVIDER_SNAPSHOTS_VOLUME:-workbench-provider-snapshots}
  workbench-provider-cache:
    name: ${WORKBENCH_PROVIDER_CACHE_VOLUME:-workbench-provider-cache}
