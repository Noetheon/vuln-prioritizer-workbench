services:
  db:
    image: postgres:16-alpine
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: ${POSTGRES_DB:-workbench}
      POSTGRES_USER: ${POSTGRES_USER:-workbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workbench}
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata

  backend:
    image: ${DOCKER_IMAGE_BACKEND:-vuln-prioritizer-workbench-backend}:${TAG:-local}
    restart: always
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-Vuln Prioritizer Workbench}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      SECRET_KEY: ${SECRET_KEY:-changethis}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:-admin@example.com}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:-changethis}
      DOMAIN: ${DOMAIN:-localhost}
      FRONTEND_HOST: ${FRONTEND_HOST:-http://localhost:5173}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost,http://localhost:5173,http://127.0.0.1:5173}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,testserver,backend}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-}
      SQLALCHEMY_DATABASE_URI: ""
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-600}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-60}
      TOKEN_FAILURE_RATE_LIMIT_PER_MINUTE: ${TOKEN_FAILURE_RATE_LIMIT_PER_MINUTE:-60}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      SESSION_RETENTION_DAYS: ${SESSION_RETENTION_DAYS:-30}
      REVOKED_API_TOKEN_RETENTION_DAYS: ${REVOKED_API_TOKEN_RETENTION_DAYS:-365}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      POSTGRES_SERVER: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-workbench}
      POSTGRES_USER: ${POSTGRES_USER:-workbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workbench}
      IMPORT_UPLOAD_DIR: /app/template-import-uploads
      REPORT_DIR: /app/template-reports
      PROVIDER_SNAPSHOT_DIR: /app/provider-snapshots
      PROVIDER_CACHE_DIR: /app/template-provider-cache
      ATTACK_ARTIFACT_DIR: /app/examples/attack
      DEMO_PROVIDER_SNAPSHOT_ENABLED: ${DEMO_PROVIDER_SNAPSHOT_ENABLED:-false}
      NVD_API_KEY: ${NVD_API_KEY:-}
      VULN_PRIORITIZER_NVD_API_KEY_ENV: ${VULN_PRIORITIZER_NVD_API_KEY_ENV:-NVD_API_KEY}
    volumes:
      - template-import-uploads:/app/template-import-uploads
      - template-reports:/app/template-reports
      - template-provider-snapshots:/app/provider-snapshots
      - template-provider-cache:/app/template-provider-cache
      - ./data:/app/examples:ro
    labels:
      - traefik.enable=${TRAEFIK_APP_ENABLED:-false}
      - traefik.http.services.workbench-backend.loadbalancer.server.port=8000
      - traefik.http.routers.workbench-backend-http.entrypoints=http
      - traefik.http.routers.workbench-backend-http.rule=Host(`api.${DOMAIN:-localhost}`)
      - traefik.http.routers.workbench-backend-http.middlewares=https-redirect
      - traefik.http.middlewares.https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.https-redirect.redirectscheme.permanent=true
      - traefik.http.routers.workbench-backend-https.entrypoints=https
      - traefik.http.routers.workbench-backend-https.rule=Host(`api.${DOMAIN:-localhost}`)
      - traefik.http.routers.workbench-backend-https.tls=true
      - traefik.http.routers.workbench-backend-https.tls.certresolver=le
      - traefik.http.routers.workbench-backend-https.middlewares=workbench-upload-limit
      - traefik.http.middlewares.workbench-upload-limit.buffering.maxRequestBodyBytes=${TRAEFIK_MAX_REQUEST_BODY_BYTES:-26214400}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, os, urllib.request; domain=os.environ.get('DOMAIN', 'localhost'); host='localhost' if domain in {'localhost', '127.0.0.1'} else f'api.{domain}'; req=urllib.request.Request('http://127.0.0.1:8000/api/v1/workbench/status', headers={'Host': host}); data=json.load(urllib.request.urlopen(req, timeout=2)); assert data['database_status'] == 'ready' and data['schema_status'] == 'ready'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: ${DOCKER_IMAGE_FRONTEND:-vuln-prioritizer-workbench-frontend}:${TAG:-local}
    restart: always
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - traefik.enable=${TRAEFIK_APP_ENABLED:-false}
      - traefik.http.services.workbench-frontend.loadbalancer.server.port=80
      - traefik.http.routers.workbench-frontend-http.entrypoints=http
      - traefik.http.routers.workbench-frontend-http.rule=Host(`${DOMAIN:-localhost}`)
      - traefik.http.routers.workbench-frontend-http.middlewares=https-redirect
      - traefik.http.routers.workbench-frontend-https.entrypoints=https
      - traefik.http.routers.workbench-frontend-https.rule=Host(`${DOMAIN:-localhost}`)
      - traefik.http.routers.workbench-frontend-https.tls=true
      - traefik.http.routers.workbench-frontend-https.tls.certresolver=le

volumes:
  app-db-data:
  template-import-uploads:
  template-reports:
  template-provider-snapshots:
  template-provider-cache:
