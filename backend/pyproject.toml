[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vuln-prioritizer-workbench"
version = "1.3.0"
description = "Local-first Workbench for explainable CVE prioritization from scanner, SBOM, VEX, and asset-context evidence using CVSS, EPSS, KEV, and curated ATT&CK/TTP context."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "vuln-prioritizer-workbench contributors" }]
keywords = [
  "cve",
  "cvss",
  "epss",
  "kev",
  "cisa-kev",
  "mitre-attack",
  "sbom",
  "vex",
  "sarif",
  "security",
  "vulnerability-management",
  "risk-based-vulnerability-management",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  "alembic>=1.13,<2.0",
  "fastapi>=0.115,<1.0",
  "defusedxml>=0.7,<1.0",
  "filelock>=3.20,<4.0",
  "jsonschema>=4.23,<5.0",
  "packageurl-python==0.17.6",
  "pydantic>=2.6,<3.0",
  "psycopg[binary]>=3.1,<4.0",
  "python-multipart>=0.0.31,<1.0",
  "PyYAML>=6.0,<7.0",
  "python-dotenv>=1.0,<2.0",
  "requests>=2.31,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "sqlmodel>=0.0.21,<1.0",
  "starlette>=1.3.1,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
vpw = "app.cli:main"

[project.urls]
Homepage = "https://github.com/Noetheon/vuln-prioritizer-workbench"
Repository = "https://github.com/Noetheon/vuln-prioritizer-workbench"
Issues = "https://github.com/Noetheon/vuln-prioritizer-workbench/issues"
Documentation = "https://github.com/Noetheon/vuln-prioritizer-workbench/tree/main/docs"
Changelog = "https://github.com/Noetheon/vuln-prioritizer-workbench/blob/main/CHANGELOG.md"
Security = "https://github.com/Noetheon/vuln-prioritizer-workbench/security/policy"

[project.optional-dependencies]
dev = [
  "beautifulsoup4>=4.12,<5.0",
  "build>=1.2,<2.0",
  "hypothesis>=6.100,<7.0",
  "httpx>=0.27,<1.0",
  "mkdocs>=1.6,<2.0",
  "mutmut>=3.0,<4.0",
  "mypy>=1.10,<3.0",
  "pip-audit>=2.7,<3.0",
  "pre-commit>=3.7,<5.0",
  "pytest>=8.0,<10.0",
  "pytest-cov>=5.0,<8.0",
  "respx>=0.21,<1.0",
  "ruff>=0.5,<1.0",
  "twine>=6.0,<8.0",
  "types-PyYAML>=6.0,<7.0",
  "types-requests>=2.32,<3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
app = [
  "alembic/script.py.mako",
  "domain/engine/py.typed",
  "resources/*",
  "resources/**/*",
  "static/*",
  "static/**/*",
]

[tool.pytest.ini_options]
addopts = "-ra --cov=app --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "error::ResourceWarning",
  "error::pytest.PytestUnraisableExceptionWarning",
]
markers = [
  "browser_e2e: real browser Workbench tests driven by Playwright.",
  "e2e: end-to-end tests that may spawn subprocesses.",
  "live_network: allow real network access through requests in this test.",
  "performance: optional performance and scale smoke tests; enable explicitly.",
  "property: deterministic property-based tests for parser and report invariants.",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "D"]
ignore = ["D105", "D107", "D203", "D212", "D401"]
extend-select = ["B018"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
pretty = true
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true

[tool.coverage.run]
omit = [
  "app/alembic/env.py",
  "app/alembic/versions/*.py",
]

[tool.mutmut]
paths_to_mutate = [
  "app/decision_core/builders.py",
  "app/services/report_bundle_archive_verification.py",
  "app/services/report_sarif_validation.py",
  "app/domain/engine/services/analysis_pipeline.py",
]
also_copy = [
  "app",
  "tests",
]
tests_dir = [
  "tests/api/import_contracts/test_decision_evidence_contract.py",
  "tests/api/test_workbench_evidence_verification_unit.py",
  "tests/test_analysis_refactor.py",
  "tests/property",
]
pytest_add_cli_args = ["--no-cov"]
mutate_only_covered_lines = true
