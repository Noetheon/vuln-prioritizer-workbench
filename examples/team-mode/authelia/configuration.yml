# Authelia 4.39 settings for the team-mode example. Secrets come from the files
# that compose.yml names, never from this file. Replace example.test with your
# own domain for a real deployment.
---
theme: auto

authentication_backend:
  file:
    # Written by ../setup.sh and mounted read-only: add users with the script,
    # then restart Authelia.
    path: /etc/authelia/users_database.yml
  # Users cannot reset or change passwords themselves, because the users file
  # is read-only and this example has no mail server.
  password_reset:
    disable: true
  password_change:
    disable: true

access_control:
  default_policy: deny
  rules:
    # The Workbench has no roles: everyone this rule admits has full access.
    - domain: workbench.example.test
      policy: one_factor
      subject: group:workbench

session:
  cookies:
    - domain: example.test
      authelia_url: https://auth.example.test
      default_redirection_url: https://workbench.example.test

storage:
  local:
    path: /var/lib/authelia/db.sqlite3

notifier:
  filesystem:
    filename: /var/lib/authelia/notification.txt
