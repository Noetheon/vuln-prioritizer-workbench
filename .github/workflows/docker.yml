name: Docker

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
  schedule:
    - cron: "43 4 * * 2"
  workflow_dispatch:

# Keep only the newest Docker smoke run for each PR/branch. Docker builds are
# the most expensive check in this repo, so stale runs should stop quickly.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-docker: ${{ steps.scope.outputs.run-docker }}
      docker-smoke-mode: ${{ steps.scope.outputs.docker-smoke-mode }}
      run-image-security: ${{ steps.scope.outputs.run-image-security }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether Docker smoke is needed
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          write_docker_outputs() {
            {
              echo "run-docker=$1"
              echo "docker-smoke-mode=$2"
              echo "run-image-security=$3"
            } >> "$GITHUB_OUTPUT"
          }

          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            write_docker_outputs true full true
            exit 0
          fi

          if [[ "${{ github.event.pull_request.draft }}" == "true" ]]; then
            echo "Draft pull request; Docker compose smoke skipped."
            write_docker_outputs false skip false
            exit 0
          fi

          base_sha="${{ github.event.pull_request.base.sha }}"
          changed_files="$(git diff --name-only "$base_sha"...HEAD)"
          printf '%s\n' "$changed_files"

          # The compose smoke remains a required check, so it runs as a job and
          # skips internally unless a PR touches runtime/build inputs. Frontend
          # route, component, and CSS changes are covered by the CI frontend
          # job and do not need a Docker rebuild on every PR.
          run_docker=false
          docker_smoke_mode=skip
          run_image_security=false
          set_demo_smoke() {
            run_docker=true
            if [[ "$docker_smoke_mode" == "skip" ]]; then
              docker_smoke_mode=demo
            fi
          }
          set_full_smoke() {
            run_docker=true
            docker_smoke_mode=full
          }
          while IFS= read -r path; do
            case "$path" in
              compose*.yml|backend/Dockerfile|frontend/Dockerfile*|docker/*)
                set_full_smoke
                ;;
              frontend/nginx.conf|frontend/nginx-backend-not-found.conf)
                set_full_smoke
                ;;
              scripts/production_readiness_smoke.py|.github/workflows/docker.yml|Makefile)
                set_full_smoke
                ;;
              backend/app/core/config.py|backend/app/main.py|backend/app/core/schema_smoke.py)
                set_full_smoke
                ;;
              backend/*|pyproject.toml|uv.lock)
                set_demo_smoke
                ;;
              scripts/docker_quickstart_api_smoke.py|scripts/start*)
                set_demo_smoke
                ;;
              .nvmrc|.npmrc|package.json|frontend/package.json|frontend/package-lock.json)
                set_demo_smoke
                ;;
              frontend/vite.config.*|frontend/tsconfig*.json|.grype.yaml)
                set_demo_smoke
                ;;
            esac

            case "$path" in
              compose*.yml|backend/Dockerfile|frontend/Dockerfile*|docker/*)
                run_image_security=true
                ;;
              pyproject.toml|uv.lock|backend/requirements*.txt)
                run_image_security=true
                ;;
              frontend/package.json|frontend/package-lock.json)
                run_image_security=true
                ;;
              .github/workflows/docker.yml|.grype.yaml|Makefile)
                run_image_security=true
                ;;
            esac
          done <<< "$changed_files"

          if [[ "$run_docker" == "true" ]]; then
            if [[ "$run_image_security" == "true" ]]; then
              image_security_output=true
            else
              image_security_output=false
            fi
            write_docker_outputs true "$docker_smoke_mode" "$image_security_output"
          else
            echo "No runtime-impacting Docker inputs changed; compose smoke skipped."
            write_docker_outputs false skip false
          fi

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    env:
      GRYPE_IMAGE: docker.io/anchore/grype:v0.106.0@sha256:f6fa9ac31f97591957edb13b7c7c24fd172cf11b6e2a2df5dd3464ebb8eefefc
      SYFT_IMAGE: docker.io/anchore/syft:v1.40.0@sha256:11a68ff5cd49a1579e1f05b061a96edf0a5add161ea5f38d62fc979704c46918

    steps:
      - name: Skip Docker smoke for non-runtime PR
        if: needs.changes.outputs.run-docker != 'true'
        run: echo "No runtime-impacting files changed; Docker compose smoke skipped."

      - name: Check out repository
        if: needs.changes.outputs.run-docker == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Run Docker quickstart API smoke
        if: needs.changes.outputs.run-docker == 'true'
        run: make docker-demo-smoke

      - name: Run production-like Docker smoke
        if: needs.changes.outputs.docker-smoke-mode == 'full'
        run: make docker-production-smoke

      - name: Generate image SBOMs
        if: needs.changes.outputs.run-image-security == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/docker-sbom
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/build/docker-sbom:/output" \
            "$SYFT_IMAGE" \
            vuln-prioritizer-workbench-backend:local \
            -o spdx-json=/output/backend.spdx.json
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/build/docker-sbom:/output" \
            "$SYFT_IMAGE" \
            vuln-prioritizer-workbench-frontend:local \
            -o spdx-json=/output/frontend.spdx.json

      - name: Generate image vulnerability reports
        if: needs.changes.outputs.run-image-security == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/docker-sbom
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.grype.yaml:/grype.yaml:ro" \
            "$GRYPE_IMAGE" \
            -c /grype.yaml \
            vuln-prioritizer-workbench-backend:local \
            -o json > build/docker-sbom/backend.grype.json
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.grype.yaml:/grype.yaml:ro" \
            "$GRYPE_IMAGE" \
            -c /grype.yaml \
            vuln-prioritizer-workbench-frontend:local \
            -o json > build/docker-sbom/frontend.grype.json

      - name: Fail on fixable high and critical image vulnerabilities
        if: needs.changes.outputs.run-image-security == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for image in \
            vuln-prioritizer-workbench-backend:local \
            vuln-prioritizer-workbench-frontend:local
          do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/.grype.yaml:/grype.yaml:ro" \
              "$GRYPE_IMAGE" \
              -c /grype.yaml \
              "$image" --only-fixed --fail-on high
          done

      - name: Upload container security artifacts
        if: needs.changes.outputs.run-image-security == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-image-security-reports
          retention-days: 14
          path: |
            build/docker-sbom/*.spdx.json
            build/docker-sbom/*.grype.json

      - name: Show compose status and logs on failure
        if: failure() && needs.changes.outputs.run-docker == 'true'
        run: |
          docker compose -f compose.yml -f compose.override.yml ps || true
          docker compose -f compose.yml -f compose.override.yml logs --no-color || true
          docker compose -f compose.yml -f compose.production-smoke.yml ps || true
          docker compose -f compose.yml -f compose.production-smoke.yml logs --no-color || true
