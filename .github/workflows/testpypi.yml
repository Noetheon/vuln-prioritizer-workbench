name: TestPyPI Publish

on:
  workflow_dispatch:

# Manual TestPyPI runs can be repeated while debugging packaging. Keep only the
# newest run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.package_version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/pyproject.toml
            .pre-commit-config.yaml

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install project and dev dependencies
        run: python -m pip install -e "backend[dev]"

      - name: Run release-readiness local checks
        run: make release-readiness-check

      - name: Build source and wheel distributions
        run: python -m build backend --outdir dist

      - name: Validate built distributions
        run: python -m twine check dist/*

      - name: Smoke test built wheel
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/workflow-artifacts/testpypi-built-wheel"
          mkdir -p "$artifact_root"
          python -m pip install --force-reinstall dist/*.whl
          python scripts/workbench_wheel_smoke.py "$artifact_root/workbench-wheel-smoke.json"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dist
          retention-days: 3
          path: dist/*

      - name: Upload TestPyPI build debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: testpypi-build-debug-artifacts
          if-no-files-found: ignore
          retention-days: 3
          path: |
            ${{ runner.temp }}/workflow-artifacts/**
            docs/example*.json
            docs/examples/*.json

      - name: Resolve package version
        id: package_version
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path
          payload = tomllib.loads(Path("backend/pyproject.toml").read_text(encoding="utf-8"))
          print(f"version={payload['project']['version']}")
          PY

  publish-testpypi:
    needs: build
    if: vars.TEST_PYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: testpypi

    steps:
      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-dist
          path: dist

      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi-install:
    needs: [build, publish-testpypi]
    if: vars.TEST_PYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository fixtures
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/pyproject.toml
            .pre-commit-config.yaml

      - name: Verify install from hosted TestPyPI
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.build.outputs.package_version }}"
          artifact_root="$RUNNER_TEMP/workflow-artifacts/verify-testpypi-install"
          wheel_root="$artifact_root/testpypi-wheel"
          mkdir -p "$artifact_root"
          mkdir -p "$wheel_root"
          python -m pip --isolated install --upgrade --index-url https://pypi.org/simple/ pip
          for attempt in 1 2 3 4 5; do
            rm -f "$wheel_root"/*.whl
            if python -m pip --isolated download \
              --no-cache-dir \
              --only-binary=:all: \
              --no-deps \
              --index-url https://test.pypi.org/simple/ \
              --dest "$wheel_root" \
              "vuln-prioritizer==${version}"; then
              python -m pip --isolated install \
                --no-cache-dir \
                --force-reinstall \
                --index-url https://pypi.org/simple/ \
                "$wheel_root"/vuln_prioritizer-"${version}"-*.whl
              python -m pip check
              python scripts/workbench_wheel_smoke.py "$artifact_root/workbench-wheel-smoke.json"
              exit 0
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "TestPyPI install verification failed after ${attempt} attempts." >&2
              exit 1
            fi
            sleep 20
          done

      - name: Upload TestPyPI verification debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-testpypi-debug-artifacts
          if-no-files-found: ignore
          retention-days: 3
          path: |
            ${{ runner.temp }}/workflow-artifacts/**
            docs/example*.json
            docs/examples/*.json
