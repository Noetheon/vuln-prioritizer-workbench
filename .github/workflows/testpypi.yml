name: TestPyPI Publish

on:
  workflow_dispatch:

# Manual TestPyPI runs can be repeated while debugging packaging. Keep only the
# newest run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      package_version: ${{ steps.package_version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.31"
          enable-cache: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the reviewed Python resolution
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check --offline --python 3.14
          UV_BUILD_CONSTRAINT=backend/requirements.lock.txt \
            uv sync --locked --all-packages --all-extras --python 3.14
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Record the TestPyPI build toolchain
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/workflow-artifacts/testpypi-build"
          mkdir -p "$evidence_dir"
          python scripts/record_release_build_inputs.py \
            --output "$evidence_dir/build-inputs.json" \
            --commit "$GITHUB_SHA" --ref "$GITHUB_REF" \
            --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Run release-readiness local checks
        run: make release-readiness-check

      - name: Reject tracked source drift before building distributions
        run: |
          git diff --exit-code
          git diff --cached --exit-code

      - name: Build source and wheel distributions
        run: |
          uv build --clear --no-build-logs --python 3.14 \
            --build-constraints backend/requirements.lock.txt --require-hashes \
            --out-dir dist backend

      - name: Validate built distributions
        run: python -m twine check dist/*

      - name: Attest build provenance for the distributions
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Smoke test built wheel
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/workflow-artifacts/testpypi-built-wheel"
          mkdir -p "$artifact_root"
          python -m pip install --force-reinstall dist/*.whl
          python scripts/workbench_wheel_smoke.py "$artifact_root/workbench-wheel-smoke.json"

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-dist
          retention-days: 3
          path: dist/*

      - name: Upload TestPyPI build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: testpypi-build-evidence
          retention-days: 14
          path: ${{ runner.temp }}/workflow-artifacts/testpypi-build/**

      - name: Upload TestPyPI build debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: testpypi-build-debug-artifacts
          if-no-files-found: ignore
          retention-days: 3
          path: |
            ${{ runner.temp }}/workflow-artifacts/**
            docs/example*.json
            docs/examples/*.json

      - name: Resolve package version
        id: package_version
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path
          payload = tomllib.loads(Path("backend/pyproject.toml").read_text(encoding="utf-8"))
          print(f"version={payload['project']['version']}")
          PY

  publish-testpypi:
    needs: build
    if: vars.TEST_PYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: testpypi

    steps:
      - name: Download built distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-dist
          path: dist

      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi-install:
    needs: [build, publish-testpypi]
    if: vars.TEST_PYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/pyproject.toml
            .pre-commit-config.yaml

      - name: Verify install from hosted TestPyPI
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.build.outputs.package_version }}"
          artifact_root="$RUNNER_TEMP/workflow-artifacts/verify-testpypi-install"
          wheel_root="$artifact_root/testpypi-wheel"
          mkdir -p "$artifact_root"
          mkdir -p "$wheel_root"
          python -m pip --isolated install --upgrade --index-url https://pypi.org/simple/ pip
          for attempt in 1 2 3 4 5; do
            rm -f "$wheel_root"/*.whl
            if python -m pip --isolated download \
              --no-cache-dir \
              --only-binary=:all: \
              --no-deps \
              --index-url https://test.pypi.org/simple/ \
              --dest "$wheel_root" \
              "vuln-prioritizer-workbench==${version}"; then
              python -m pip --isolated install \
                --no-cache-dir \
                --force-reinstall \
                --index-url https://pypi.org/simple/ \
                "$wheel_root"/vuln_prioritizer_workbench-"${version}"-*.whl
              python -m pip check
              python scripts/workbench_wheel_smoke.py "$artifact_root/workbench-wheel-smoke.json"
              exit 0
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "TestPyPI install verification failed after ${attempt} attempts." >&2
              exit 1
            fi
            sleep 20
          done

      - name: Upload TestPyPI verification debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verify-testpypi-debug-artifacts
          if-no-files-found: ignore
          retention-days: 3
          path: |
            ${{ runner.temp }}/workflow-artifacts/**
            docs/example*.json
            docs/examples/*.json
