name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
  workflow_dispatch:

# Cancel superseded commits on the same PR or branch so stale CI does not
# continue consuming runner minutes after a newer push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Skip expensive Python gate for draft PR
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: echo "Draft pull request; skipping expensive Python workflow gate."

      - name: Set up Python
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/pyproject.toml
            .pre-commit-config.yaml

      - name: Install project and dev dependencies
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft
        run: python -m pip install -e "backend[dev]"

      - name: Run local-equivalent workflow gate
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft
        run: make workflow-check

  action-smoke:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare action smoke output directory
        run: mkdir -p build/vpw-082-action-smoke

      - name: Generate locked analysis JSON
        id: analyze
        uses: ./
        with:
          mode: analyze
          input: data/input_fixtures/trivy_report.json
          input-format: trivy-json
          output-format: json
          output-path: build/vpw-082-action-smoke/analysis.json
          provider-snapshot-file: data/demo_provider_snapshot.json
          locked-provider-data: "true"
          summary-output-path: build/vpw-082-action-smoke/summary.md
          summary-template: compact
          github-step-summary: "true"

      - name: Render Workbench Markdown report
        id: markdown-report
        uses: ./
        with:
          mode: workbench-report
          input: ${{ steps.analyze.outputs.report-path }}
          output-format: markdown
          output-path: build/vpw-082-action-smoke/workbench-report.md

      - name: Render Workbench JSON report
        id: json-report
        uses: ./
        with:
          mode: workbench-report
          input: ${{ steps.analyze.outputs.report-path }}
          output-format: json
          output-path: build/vpw-082-action-smoke/workbench-report.json

      - name: Verify action smoke artifacts
        run: |
          test -s build/vpw-082-action-smoke/analysis.json
          test -s build/vpw-082-action-smoke/summary.md
          test -s build/vpw-082-action-smoke/workbench-report.md
          test -s build/vpw-082-action-smoke/workbench-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("build/vpw-082-action-smoke")
          analysis = json.loads((root / "analysis.json").read_text(encoding="utf-8"))
          report = json.loads((root / "workbench-report.json").read_text(encoding="utf-8"))
          assert analysis["metadata"]["locked_provider_data"] is True
          assert analysis["metadata"]["provider_snapshot_file"] == "data/demo_provider_snapshot.json"
          assert report["metadata"]["output_format"] == "json"
          assert (root / "workbench-report.md").read_text(encoding="utf-8").startswith("# ")
          PY

      - name: Upload VPW-082 action smoke artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vpw-082-action-smoke-reports
          retention-days: 3
          path: |
            build/vpw-082-action-smoke/analysis.json
            build/vpw-082-action-smoke/summary.md
            build/vpw-082-action-smoke/workbench-report.md
            build/vpw-082-action-smoke/workbench-report.json

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide whether frontend gate is needed
        id: frontend-scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run-frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event.pull_request.draft }}" == "true" ]]; then
            echo "Draft pull request; skipping expensive frontend gate."
            echo "run-frontend=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="${{ github.event.pull_request.base.sha }}"
          changed_files="$(git diff --name-only "$base_sha"...HEAD)"
          printf '%s\n' "$changed_files"

          run_frontend=false
          while IFS= read -r path; do
            case "$path" in
              frontend/*|backend/app/*|backend/src/*)
                run_frontend=true
                ;;
              backend/pyproject.toml|pyproject.toml|Makefile)
                run_frontend=true
                ;;
              scripts/generate-client.sh|.github/workflows/ci.yml)
                run_frontend=true
                ;;
            esac
          done <<< "$changed_files"

          if [[ "$run_frontend" == "true" ]]; then
            echo "run-frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "No frontend/API/runtime-impacting files changed; skipping expensive frontend gate."
            echo "run-frontend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip frontend gate
        if: steps.frontend-scope.outputs.run-frontend != 'true'
        run: echo "Frontend gate skipped; no frontend/runtime-impacting files changed."

      - name: Set up Python
        if: steps.frontend-scope.outputs.run-frontend == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/pyproject.toml

      - name: Set up Node
        if: steps.frontend-scope.outputs.run-frontend == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend package
        if: steps.frontend-scope.outputs.run-frontend == 'true'
        run: python -m pip install -e "backend[dev]"

      - name: Install frontend dependencies
        if: steps.frontend-scope.outputs.run-frontend == 'true'
        run: make frontend-install

      - name: Lint frontend
        if: steps.frontend-scope.outputs.run-frontend == 'true'
        run: make frontend-lint

      - name: Check frontend lint drift
        if: steps.frontend-scope.outputs.run-frontend == 'true'
        run: git diff --exit-code -- frontend

      - name: Build frontend
        if: steps.frontend-scope.outputs.run-frontend == 'true'
        run: make frontend-build

      - name: Regenerate frontend client
        if: steps.frontend-scope.outputs.run-frontend == 'true'
        run: make frontend-generate-client

      - name: Check generated frontend client drift
        if: steps.frontend-scope.outputs.run-frontend == 'true'
        run: git diff --exit-code -- frontend/src/client

      - name: Run frontend unit tests with coverage
        if: steps.frontend-scope.outputs.run-frontend == 'true'
        run: make frontend-test-unit-coverage

      - name: Install Playwright browser
        if: steps.frontend-scope.outputs.run-frontend == 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run full frontend Playwright suite
        if: steps.frontend-scope.outputs.run-frontend == 'true'
        run: npm --prefix frontend run test

      - name: Upload frontend Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-evidence
          retention-days: 3
          path: |
            frontend/test-results/evidence
            frontend/test-results/**
            frontend/playwright-report
          if-no-files-found: ignore
