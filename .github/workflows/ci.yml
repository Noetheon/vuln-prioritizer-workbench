name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
  workflow_dispatch:

# Cancel superseded commits on the same PR or branch so stale CI does not
# continue consuming runner minutes after a newer push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Skip expensive Python gate for draft PR
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: echo "Draft pull request; skipping expensive Python workflow gate."

      - name: Set up Python
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/pyproject.toml
            .pre-commit-config.yaml

      - name: Install project and dev dependencies
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft
        run: python -m pip install -e "backend[dev]"

      - name: Run local Workbench gate
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft
        run: make local-workbench-check

  dependency-audit:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/pyproject.toml
            backend/requirements.lock.txt

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install audit tooling
        run: python -m pip install -e "backend[dev]"

      - name: Run dependency audit
        run: make dependency-audit

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether frontend gate is needed
        id: frontend-scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run-frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event.pull_request.draft }}" == "true" ]]; then
            echo "Draft pull request; skipping expensive frontend gate."
            echo "run-frontend=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="${{ github.event.pull_request.base.sha }}"
          changed_files="$(git diff --name-only "$base_sha"...HEAD)"
          printf '%s\n' "$changed_files"

          run_frontend=false
          while IFS= read -r path; do
            case "$path" in
              frontend/*|backend/app/*|backend/src/*)
                run_frontend=true
                ;;
              backend/pyproject.toml|pyproject.toml|Makefile)
                run_frontend=true
                ;;
              scripts/generate-client.sh|.github/workflows/ci.yml)
                run_frontend=true
                ;;
            esac
          done <<< "$changed_files"

          if [[ "$run_frontend" == "true" ]]; then
            echo "run-frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "No frontend/API/runtime-impacting files changed; skipping expensive frontend gate."
            echo "run-frontend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip frontend gate
        if: steps.frontend-scope.outputs.run-frontend != 'true'
        run: echo "Frontend gate skipped; no frontend/runtime-impacting files changed."

      - name: Set up Python
        if: steps.frontend-scope.outputs.run-frontend == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/pyproject.toml

      - name: Set up Node
        if: steps.frontend-scope.outputs.run-frontend == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend package
        if: steps.frontend-scope.outputs.run-frontend == 'true'
        run: python -m pip install -e "backend[dev]"

      - name: Install frontend dependencies
        if: steps.frontend-scope.outputs.run-frontend == 'true'
        run: make frontend-install

      - name: Lint frontend
        if: steps.frontend-scope.outputs.run-frontend == 'true'
        run: make frontend-lint

      - name: Check frontend lint drift
        if: steps.frontend-scope.outputs.run-frontend == 'true'
        run: git diff --exit-code -- frontend

      - name: Build frontend
        if: steps.frontend-scope.outputs.run-frontend == 'true'
        run: make frontend-build

      - name: Typecheck frontend tests
        if: steps.frontend-scope.outputs.run-frontend == 'true'
        run: make frontend-test-types

      - name: Regenerate frontend client
        if: steps.frontend-scope.outputs.run-frontend == 'true'
        run: make frontend-generate-client

      - name: Check generated frontend client drift
        if: steps.frontend-scope.outputs.run-frontend == 'true'
        run: git diff --exit-code -- frontend/src/client

      - name: Run frontend unit tests with coverage
        if: steps.frontend-scope.outputs.run-frontend == 'true'
        run: make frontend-test-unit-coverage

      - name: Install Playwright browsers
        if: steps.frontend-scope.outputs.run-frontend == 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run full frontend Playwright suite
        if: steps.frontend-scope.outputs.run-frontend == 'true'
        run: npm --prefix frontend run test

      - name: Upload frontend Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-playwright-evidence
          retention-days: 3
          path: |
            frontend/test-results/evidence
            frontend/test-results/**
            frontend/playwright-report
          if-no-files-found: ignore
