name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Cancel superseded CodeQL runs for the same PR/branch while keeping the
# weekly and manual security analysis entry points intact.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze ${{ matrix.display_name }}
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            display_name: Python
          - language: javascript-typescript
            display_name: JavaScript/TypeScript

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether CodeQL analysis is needed
        id: codeql-scope
        shell: bash
        run: |
          set -euo pipefail
          write_codeql_output() {
            echo "run-codeql=$1" >> "$GITHUB_OUTPUT"
          }

          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            write_codeql_output true
            exit 0
          fi

          base_sha="${{ github.event.pull_request.base.sha }}"
          changed_files="$(git diff --name-only "$base_sha"...HEAD)"
          printf '%s\n' "$changed_files"

          run_codeql=false
          while IFS= read -r path; do
            case "$path" in
              backend/app/*|backend/pyproject.toml|pyproject.toml|uv.lock)
                run_codeql=true
                ;;
              frontend/src/*|frontend/package.json|frontend/package-lock.json)
                run_codeql=true
                ;;
              frontend/vite.config.*|frontend/tsconfig*.json|.github/workflows/codeql.yml)
                run_codeql=true
                ;;
            esac
          done <<< "$changed_files"

          if [[ "$run_codeql" == "true" ]]; then
            write_codeql_output true
          else
            echo "No CodeQL-relevant source or dependency inputs changed; analysis skipped."
            write_codeql_output false
          fi

      - name: Skip CodeQL analysis
        if: steps.codeql-scope.outputs.run-codeql != 'true'
        run: echo "CodeQL skipped for non-source PR scope; scheduled and main runs remain full."

      - name: Set up Python
        if: steps.codeql-scope.outputs.run-codeql == 'true' && matrix.language == 'python'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/pyproject.toml
            .pre-commit-config.yaml

      - name: Initialize CodeQL
        if: steps.codeql-scope.outputs.run-codeql == 'true'
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Install project and dev dependencies
        if: steps.codeql-scope.outputs.run-codeql == 'true' && matrix.language == 'python'
        run: python -m pip install -e "backend[dev]"

      - name: Perform CodeQL analysis
        if: steps.codeql-scope.outputs.run-codeql == 'true'
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4
