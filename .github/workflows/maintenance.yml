name: Maintenance

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

# Weekly/manual maintenance can be expensive; cancel an older copy when the
# same workflow is re-run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  local-workbench-health:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/pyproject.toml
            .pre-commit-config.yaml

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install project and dev dependencies
        run: python -m pip install -e "backend[dev]"

      - name: Run weekly local Workbench health checks
        run: |
          make check
          make frontend-check
          make docs-check

      - name: Upload maintenance debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: maintenance-local-workbench-debug
          if-no-files-found: ignore
          retention-days: 3
          path: |
            ${{ runner.temp }}/workflow-artifacts/**
            docs/example*.json
            docs/examples/*.json

  quality-10:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/pyproject.toml
            .pre-commit-config.yaml

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install project and dev dependencies
        run: python -m pip install -e "backend[dev]"

      - name: Run 10/10 quality gate
        run: make quality-10-check

      - name: Upload maintenance debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: maintenance-quality-10-debug
          if-no-files-found: ignore
          retention-days: 3
          path: |
            ${{ runner.temp }}/workflow-artifacts/**
            docs/example*.json
            docs/examples/*.json
