name: Maintenance

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

# Weekly/manual maintenance can be expensive; cancel an older copy when the
# same workflow is re-run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  local-workbench-health:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/pyproject.toml
            .pre-commit-config.yaml

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install project and dev dependencies
        run: python -m pip install -e "backend[dev]"

      - name: Run weekly local Workbench health checks
        run: |
          make check
          make frontend-check
          make docs-check

      - name: Upload maintenance debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maintenance-local-workbench-debug
          if-no-files-found: ignore
          retention-days: 3
          path: |
            ${{ runner.temp }}/workflow-artifacts/**
            docs/example*.json
            docs/examples/*.json
