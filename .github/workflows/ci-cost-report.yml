name: CI Cost Report

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

# The report only reads recent Actions metadata and should not overlap with
# itself if a manual run is started near the weekly scheduled run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Generate CI cost report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/ci-cost
          python3 scripts/ci_cost_report.py \
            --limit 20 \
            --json-output build/ci-cost/ci-cost-report.json \
            | tee build/ci-cost/ci-cost-report.md
          cat build/ci-cost/ci-cost-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CI cost report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-cost-report
          retention-days: 30
          path: |
            build/ci-cost/ci-cost-report.md
            build/ci-cost/ci-cost-report.json
