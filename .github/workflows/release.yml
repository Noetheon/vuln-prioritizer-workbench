name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Release runs are scoped by ref, so a new tag does not cancel another tag.
# Re-running the same ref cancels stale work before publishing artifacts.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    outputs:
      release_notes_body_path: ${{ steps.release_notes.outputs.body_path }}

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/pyproject.toml
            .pre-commit-config.yaml

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install project and dev dependencies
        run: python -m pip install -e "backend[dev]"

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("backend/pyproject.toml").read_text())["project"]["version"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${package_version}." >&2
            exit 1
          fi

      - name: Run release-readiness gate before publishing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/workflow-artifacts/release-readiness"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit_sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF_NAME}"
            echo "command=make release-readiness-check"
          } | tee "$RUNNER_TEMP/workflow-artifacts/release-readiness/release-readiness-metadata.txt"
          make release-readiness-check 2>&1 | tee "$RUNNER_TEMP/workflow-artifacts/release-readiness/release-readiness-check.log"

      - name: Build source and wheel distributions
        run: rm -rf dist && python -m build backend --outdir dist

      - name: Validate built distributions
        run: python -m twine check dist/*

      - name: Build local Workbench release bundle
        run: make release-bundle

      - name: Record release artifact hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/workflow-artifacts/release-readiness"
          shasum -a 256 dist/* | tee "$RUNNER_TEMP/workflow-artifacts/release-readiness/dist-sha256.txt"
          if [[ -f build/v1.0-demo-evidence-bundle-verification.json ]]; then
            cp build/v1.0-demo-evidence-bundle-verification.json \
              "$RUNNER_TEMP/workflow-artifacts/release-readiness/evidence-bundle-verification.json"
          fi

      - name: Smoke test built wheel
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/workflow-artifacts/release-built-wheel"
          mkdir -p "$artifact_root"
          python -m pip install --force-reinstall dist/*.whl
          python scripts/workbench_wheel_smoke.py "$artifact_root/workbench-wheel-smoke.json"

      - name: Smoke test source-at-tag install path
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/workflow-artifacts/release-source-tag"
          mkdir -p "$artifact_root"
          python -m pip install --force-reinstall \
            "git+https://github.com/${GITHUB_REPOSITORY}.git@${GITHUB_REF_NAME}#subdirectory=backend"
          python scripts/workbench_wheel_smoke.py "$artifact_root/workbench-source-smoke.json"

      - name: Resolve release notes path
        id: release_notes
        shell: bash
        run: |
          path="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -f "$path" ]]; then
            echo "body_path=$path" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dist
          retention-days: 3
          path: dist/*

      - name: Upload release-readiness evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-readiness-evidence
          retention-days: 14
          path: ${{ runner.temp }}/workflow-artifacts/release-readiness/**

      - name: Upload release debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-debug-artifacts
          if-no-files-found: ignore
          retention-days: 3
          path: |
            ${{ runner.temp }}/workflow-artifacts/**
            docs/example*.json
            docs/examples/*.json

  publish-github-release:
    needs: build-and-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-dist
          path: dist

      - name: Download release-readiness evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-readiness-evidence
          path: release-readiness-evidence

      - name: Publish GitHub release from checked-in notes
        if: needs.build-and-release.outputs.release_notes_body_path != ''
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          body_path: ${{ needs.build-and-release.outputs.release_notes_body_path }}
          files: |
            dist/*
            release-readiness-evidence/dist-sha256.txt

      - name: Publish GitHub release with generated notes
        if: needs.build-and-release.outputs.release_notes_body_path == ''
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          generate_release_notes: true
          files: |
            dist/*
            release-readiness-evidence/dist-sha256.txt

  publish-pypi:
    needs: build-and-release
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-dist
          path: dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1

  verify-pypi-install:
    needs: publish-pypi
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository fixtures
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/pyproject.toml
            .pre-commit-config.yaml

      - name: Verify install from live PyPI
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          artifact_root="$RUNNER_TEMP/workflow-artifacts/verify-pypi-install"
          mkdir -p "$artifact_root"
          python -m pip install --upgrade pip
          for attempt in 1 2 3 4 5; do
            if python -m pip install --force-reinstall "vuln-prioritizer-workbench==${version}"; then
              python scripts/workbench_wheel_smoke.py "$artifact_root/workbench-pypi-smoke.json"
              exit 0
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "PyPI install verification failed after ${attempt} attempts." >&2
              exit 1
            fi
            sleep 20
          done

      - name: Upload PyPI verification debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-pypi-debug-artifacts
          if-no-files-found: ignore
          retention-days: 3
          path: |
            ${{ runner.temp }}/workflow-artifacts/**
            docs/example*.json
            docs/examples/*.json
