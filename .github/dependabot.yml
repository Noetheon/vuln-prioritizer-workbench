version: 2
updates:
  # The root uv.lock is authoritative; requirements*.lock.txt are exports.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "maintenance"
      - "dependencies"
      - "python"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "maintenance"
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "maintenance"
      - "dependencies"
      - "type:frontend"
      - "area:ui"
    groups:
      frontend-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "lucide-react"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
      - "/docker/security-tools"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "maintenance"
      - "dependencies"
      - "area:security"
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "maintenance"
      - "dependencies"
      - "area:security"
