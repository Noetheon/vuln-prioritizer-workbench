# Temporary CI waiver for the official Python 3.13 runtime image.
#
# Grype marks the Python 3.13.14 binary as fixable for CVE-2026-15308, but its
# only listed fixed version is Python 3.15.0. The project runtime and CI policy
# remain on stable Python 3.13. Keep this waiver scoped to the exact binary
# package/version so it expires automatically when the base image moves.
ignore:
  - vulnerability: CVE-2026-15308
    fix-state: fixed
    package:
      name: python
      version: 3.13.14
      type: binary
