services:
  db:
    restart: "no"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for production smoke.}

  backend:
    restart: "no"
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY for production smoke.}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?Set FIRST_SUPERUSER_PASSWORD for production smoke.}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for production smoke.}
      DOMAIN: workbench.example.test
      FRONTEND_HOST: https://workbench.example.test
      BACKEND_CORS_ORIGINS: https://workbench.example.test
      ALLOWED_HOSTS: workbench.example.test,api.workbench.example.test
      API_DOCS_ENABLED: "false"
      DEMO_PROVIDER_SNAPSHOT_ENABLED: "true"
    command:
      - sh
      - -c
      - |
        set -e
        cp -n /app/examples/*provider_snapshot*.json /app/provider-snapshots/ 2>/dev/null || true
        python -m app.core.migration_bootstrap
        alembic -c /app/backend/alembic.ini upgrade head
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    restart: "no"
    ports:
      - "127.0.0.1:${PRODUCTION_SMOKE_FRONTEND_PORT:-5180}:8080"
    build:
      args:
        VITE_API_URL: ""
        NODE_ENV: production
