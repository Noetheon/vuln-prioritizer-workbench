services:
  db:
    restart: "no"

  backend:
    restart: "no"
    ports:
      - "127.0.0.1:${DOCKER_DEMO_BACKEND_PORT:-8000}:8000"
    environment:
      DEMO_PROVIDER_SNAPSHOT_ENABLED: "true"
      DEMO_WORKSPACE_ENABLED: "true"
    command:
      - sh
      - -c
      - |
        set -e
        cp -f /app/examples/demo_provider_snapshot.json /app/provider-snapshots/demo_provider_snapshot.json 2>/dev/null || true
        alembic -c /app/backend/alembic.ini upgrade head
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    develop:
      watch:
        - path: ./backend/app
          action: sync
          target: /app/backend/app
        - path: ./backend/pyproject.toml
          action: rebuild

  worker:
    restart: "no"
    environment:
      DEMO_PROVIDER_SNAPSHOT_ENABLED: "true"
      DEMO_WORKSPACE_ENABLED: "true"
    command:
      - python
      - -m
      - app.workers.workflow_worker
      - --poll-interval
      - "1"
    develop:
      watch:
        - path: ./backend/app
          action: sync
          target: /app/backend/app
        - path: ./backend/pyproject.toml
          action: rebuild

  frontend:
    restart: "no"
    ports:
      - "127.0.0.1:${DOCKER_DEMO_FRONTEND_PORT:-5173}:8080"

  playwright:
    build:
      context: .
      dockerfile: frontend/Dockerfile.playwright
      args:
        VITE_API_URL: http://backend:8000
        NODE_ENV: production
    profiles:
      - playwright
    ipc: host
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_URL: http://backend:8000
      PLAYWRIGHT_HTML_HOST: 0.0.0.0
      CI: ${CI:-}
    volumes:
      - ./frontend/blob-report:/app/frontend/blob-report
      - ./frontend/test-results:/app/frontend/test-results
    ports:
      - "127.0.0.1:9323:9323"
