services:
  db:
    restart: "no"

  backend:
    restart: "no"
    ports:
      - "127.0.0.1:8000:8000"
    command:
      - sh
      - -c
      - |
        cp -n /app/examples/*provider_snapshot*.json /app/provider-snapshots/ 2>/dev/null || true
        python - <<'PY'
        from sqlmodel import Session

        from app.core.db import engine, init_db
        from app.models import import_table_models

        import_table_models()
        with Session(engine) as session:
            init_db(session)
        PY
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    develop:
      watch:
        - path: ./backend/app
          action: sync
          target: /app/backend/app
        - path: ./backend/src
          action: sync
          target: /app/backend/src
        - path: ./backend/pyproject.toml
          action: rebuild

  frontend:
    restart: "no"
    ports:
      - "127.0.0.1:5173:80"

  playwright:
    build:
      context: .
      dockerfile: frontend/Dockerfile.playwright
      args:
        VITE_API_URL: http://backend:8000
        NODE_ENV: production
    profiles:
      - playwright
    ipc: host
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_URL: http://backend:8000
      PLAYWRIGHT_HTML_HOST: 0.0.0.0
      CI: ${CI:-}
    volumes:
      - ./frontend/blob-report:/app/frontend/blob-report
      - ./frontend/test-results:/app/frontend/test-results
    ports:
      - "127.0.0.1:9323:9323"
